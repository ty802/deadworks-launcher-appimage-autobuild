name: Upstream update & release

# Once a day, compare the rev pinned in flake.nix with the upstream default
# branch. If it moved (or the release for that rev is missing), refresh the
# pins, build the AppImage, commit the pins back, and publish a release.
on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily
  workflow_dispatch:
    inputs:
      force:
        description: "Force a rebuild even when already up to date"
        type: boolean
        default: false
  # Dispatch via the REST API: POST /repos/{owner}/{repo}/dispatches
  # with {"event_type":"upstream-release","client_payload":{"force":true}}
  repository_dispatch:
    types: [upstream-release]
  # Reusable from another workflow via `uses: ./.github/workflows/upstream-release.yml`
  workflow_call:
    inputs:
      force:
        description: "Force a rebuild even when already up to date"
        type: boolean
        default: false

permissions:
  contents: write # needed to push pins and create releases
  actions: write # needed to save the local Nix binary cache

concurrency:
  group: upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Deadworks-net/deadworks

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      rev: ${{ steps.check.outputs.rev }}
      short: ${{ steps.check.outputs.short }}
      version: ${{ steps.check.outputs.version }}
      message: ${{ steps.check.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned rev with upstream HEAD
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || github.event.client_payload.force || false }}
        run: |
          set -euo pipefail

          current="$(sed -nE 's#.*github:Deadworks-net/deadworks\?dir=launcher&rev=([0-9a-f]{40}).*#\1#p' flake.nix | head -n1)"
          echo "Pinned upstream rev: ${current:-<none>}"

          # The flake rev is a whole-repository commit, so track the default
          # branch HEAD rather than commits filtered to launcher/.
          latest="$(gh api "repos/${UPSTREAM_REPO}/commits?per_page=1" --jq '.[0].sha')"
          message="$(gh api "repos/${UPSTREAM_REPO}/commits/${latest}" --jq '.commit.message | split("\n")[0]')"
          echo "Upstream HEAD: ${latest} — ${message}"

          {
            echo "rev=${latest}"
            echo "short=${latest:0:7}"
            echo "message=${message}"
          } >> "$GITHUB_OUTPUT"

          # Version is read from the Tauri config at the upstream rev.
          version="$(gh api "repos/${UPSTREAM_REPO}/contents/launcher/src-tauri/tauri.conf.json?ref=${latest}" \
            --jq '.content' | base64 --decode | jq -r '.version // empty')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            version="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";$/\1/p' package.nix | head -n1)"
            echo "::warning::Could not read upstream version; keeping ${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          tag="upstream-${latest:0:7}"
          if [[ "$current" == "$latest" ]] && gh release view "$tag" >/dev/null 2>&1 && [[ "$FORCE" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at ${latest} and release ${tag} exists; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Will update and release ${tag}."
          fi

  build:
    name: Build & release
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # A cached directory of NARs acts as a local binary cache. Unsigned
      # narinfo files are fine for a file:// cache we control.
      NIX_CONFIG: |
        extra-substituters = file:///tmp/nix-bincache
        require-sigs = false
    steps:
      - uses: actions/checkout@v4

      - name: Compute binary cache key
        run: echo "NIX_CACHE_KEY=nix-bincache-Linux-${{ hashFiles('flake.lock', '*.nix') }}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Restore local Nix binary cache
        uses: actions/cache@v4
        with:
          path: /tmp/nix-bincache
          key: ${{ env.NIX_CACHE_KEY }}
          restore-keys: |
            nix-bincache-${{ runner.os }}-

      - name: Prepare local binary cache directory
        run: mkdir -p /tmp/nix-bincache

      - name: Refresh pins (rev, lockfile, version, bun hash)
        env:
          REV: ${{ needs.check.outputs.rev }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash scripts/update-upstream.sh

      - name: Build AppImage
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          nix build .#appimage
          mkdir -p dist
          # `result` is a symlink whose target has the desired name, but cp
          # uses the source name, so give the copy an explicit filename.
          cp -L result "dist/Deadworks-${VERSION}-x86_64-linux.AppImage"
          ls -lh dist

      - name: Seed local binary cache with this build's outputs
        run: |
          set -euo pipefail
          # Start from an empty cache so NARs from earlier runs cannot
          # accumulate inside this one (restore-keys may have brought some in).
          rm -rf /tmp/nix-bincache/*
          # Only our own outputs, not the whole nixpkgs closure (which is
          # already on cache.nixos.org). --no-recursive keeps the cache small.
          mapfile -t paths < <(nix build --no-link --print-out-paths .#bunDeps .#deadworks .#appimage)
          nix copy --to "file:///tmp/nix-bincache?compression=zstd" --no-recursive "${paths[@]}"
          du -sh /tmp/nix-bincache

      - name: Prune stale binary caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches" \
            --jq ".actions_caches[]
                  | select(.key | startswith(\"nix-bincache-\"))
                  | select(.key != \"${NIX_CACHE_KEY}\")
                  | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null
              echo "deleted stale cache ${id}"
            done

      - name: Commit updated pins
        env:
          REV: ${{ needs.check.outputs.rev }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock package.nix
          if git diff --cached --quiet; then
            echo "No pin changes to commit."
          else
            git commit -m "chore: update Deadworks upstream to ${REV}"
            git push
          fi

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: upstream-${{ needs.check.outputs.short }}
          name: Deadworks Launcher ${{ needs.check.outputs.version }} (${{ needs.check.outputs.short }})
          body: |
            Automated build of upstream commit [`${{ needs.check.outputs.short }}`](https://github.com/Deadworks-net/deadworks/commit/${{ needs.check.outputs.rev }}).

            > ${{ needs.check.outputs.message }}

            Built with Nix; the AppImage carries its own WebKitGTK/GTK closure.
          files: dist/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
